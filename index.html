<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Justin Hilton Photography</title>
<style>
:root {
  --bg: #f7f6f3;
  --text: #222;
  --accent: #111;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: #fff;
  border-bottom: 1px solid #ddd;
}
.nav-title {
  font-weight: 600;
  font-size: 18px;
}
.nav-links a {
  margin-left: 16px;
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

/* BANNER */
.banner {
  position: relative;
  width: 100%;
  height: 360px;
  background: url("photos/banner.jpg") center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner h1 {
  color: white;
  font-size: 42px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-shadow: 0 4px 18px rgba(0,0,0,.45);
}

/* CONTROLS */
.controls {
  max-width: 1400px;
  margin: 30px auto 10px;
  padding: 0 16px;
}
select {
  padding: 6px 10px;
  font-size: 14px;
}

/* MASONRY GALLERY */
.gallery {
  column-count: 4;
  column-gap: 14px;
  max-width: 1400px;
  margin: 20px auto 60px;
  padding: 0 16px;
}
@media (max-width: 1200px) { .gallery { column-count: 3; } }
@media (max-width: 800px)  { .gallery { column-count: 2; } }
@media (max-width: 500px)  { .gallery { column-count: 1; } }

.photo {
  break-inside: avoid;
  margin-bottom: 14px;
  position: relative; /* required for absolute button */
}
.photo img {
  width: 100%;
  display: block;
  border-radius: 6px;
  cursor: pointer;
}

/* LIKE BUTTON */
.like-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(255, 255, 255, 0.9);
  color: #e74c3c;
  font-size: 16px;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: transform 0.15s ease;
  z-index: 10;
}
.like-btn:hover {
  transform: scale(1.1);
}
.like-btn span.count {
  font-weight: 600;
  color: #333;
  font-size: 14px;
}

/* POP ANIMATION */
.like-btn.pop {
  animation: pop 0.3s ease forwards;
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.5); }
  100% { transform: scale(1); }
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.lightbox img {
  max-width: 90%;
  max-height: 80%;
}
.lightbox .close,
.lightbox .prev,
.lightbox .next {
  position: absolute;
  color: white;
  font-size: 36px;
  cursor: pointer;
  user-select: none;
}
.close { top: 20px; right: 30px; }
.prev { left: 30px; }
.next { right: 30px; }
.lightbox-like {
  position: absolute;
  bottom: 30px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 40px 10px;
  font-size: 14px;
  color: #444;
}

</style>
</head>
<body>

<nav>
  <div class="nav-title">Justin Hilton Photography</div>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="game.html">Bobby’s B‑2 Bomber Game</a>
  </div>
</nav>

<div class="banner">
  <h1>Justin Hilton Photography</h1>
</div>

<div class="controls">
  Sort by:
  <select id="sortSelect">
    <option value="default">Default</option>
    <option value="likes">Most Liked</option>
  </select>
</div>

<div id="gallery" class="gallery"></div>

<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <img id="lightboxImg" />
  <span class="next">&#10095;</span>
  <div id="lightboxLike" class="lightbox-like">♡ Like</div>
</div>

<footer>
  Contact me at
  <a href="mailto:justinhiltonphotography@gmail.com">
    justinhiltonphotography@gmail.com
  </a>
</footer>

<!-- Scripts -->
<script src="photos.js"></script>
<script src="likes.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const gallery = document.getElementById("gallery");
  const sortSelect = document.getElementById("sortSelect");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxLike = document.getElementById("lightboxLike");

  let likes = {};
  window.photos = [];
  let currentIndex = 0;

  // Track which photos this browser has liked
  let likedPhotos = JSON.parse(localStorage.getItem("liked_photos") || "[]");

  loadLikes().then((loadedLikes) => {
    likes = loadedLikes;
    photos = PHOTOS.map(p => ({
      src: p,
      liked: likedPhotos.includes(p)
    }));
    render();
  });

  function render() {
    gallery.innerHTML = "";
    photos.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "photo";
      div.style.position = "relative";

      const img = document.createElement("img");
      img.src = p.src;
      img.onclick = () => openLightbox(i);

      const btn = document.createElement("span");
      btn.className = "like-btn";
      btn.innerHTML = (p.liked ? "❤️" : "♡") + ` <span class="count">${likes[p.src] || 0}</span>`;
      btn.onclick = () => toggleLike(i);

      div.append(img, btn);
      gallery.appendChild(div);
    });
  }

  function toggleLike(i) {
    const p = photos[i];
    const galleryBtn = gallery.children[i].querySelector(".like-btn");

    if (p.liked) {
      // Unlike
      p.liked = false;
      likes[p.src] = Math.max((likes[p.src] || 1) - 1, 0);
      likedPhotos = likedPhotos.filter(src => src !== p.src);
    } else {
      // Like
      p.liked = true;
      likes[p.src] = (likes[p.src] || 0) + 1;
      likedPhotos.push(p.src);
    }

    localStorage.setItem("liked_photos", JSON.stringify(likedPhotos));

    // Heart pop animation
    galleryBtn.classList.remove("pop");
    void galleryBtn.offsetWidth; // restart animation
    galleryBtn.classList.add("pop");

    render();
    updateLightbox();
    saveLikes(likes);
  }

  if (sortSelect) {
    sortSelect.onchange = () => {
      if (sortSelect.value === "likes") {
        photos.sort((a,b) => (likes[b.src] || 0) - (likes[a.src] || 0));
      } else {
        photos = PHOTOS.map(p => ({
          src: p,
          liked: likedPhotos.includes(p)
        }));
      }
      render();
    };
  }

  function openLightbox(i) {
    currentIndex = i;
    updateLightbox();
    lightbox.style.display = "flex";
  }

  function updateLightbox() {
    const p = photos[currentIndex];
    lightboxImg.src = p.src;
    lightboxLike.textContent = (p.liked ? "❤️ " : "♡ ") + (likes[p.src] || 0) + " likes";
  }

  document.querySelector(".close").onclick = () => lightbox.style.display = "none";
  document.querySelector(".prev").onclick = () => {
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    updateLightbox();
  };
  document.querySelector(".next").onclick = () => {
    currentIndex = (currentIndex + 1) % photos.length;
    updateLightbox();
  };
  lightboxLike.onclick = () => {
    toggleLike(currentIndex);
    updateLightbox();
  };
});
</script>



</body>
</html>
